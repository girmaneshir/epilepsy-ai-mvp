name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Install CPU torch explicitly to avoid huge CUDA downloads
      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Lint
        run: |
          pip install ruff
          ruff check src scripts tests

      # Fast tests don't load AI models, so they run quickly on every push
      - name: Fast tests
        run: pytest tests/test_guardrails.py -v

      # Slow tests load NLLB (2.4GB), so we only run them on the main branch
      - name: Slow tests (main only)
        if: github.ref == 'refs/heads/main'
        run: pytest -v
